name: Build Dogos Los Encinos APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          mkdir proyecto
          unzip DogosProyecto.zip -d proyecto
          find proyecto -name gradlew -type f

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android
        uses: android-actions/setup-android@v3

      - name: Compilar APK
        run: |
          cd proyecto
          ROOT=$(find . -name gradlew -type f | head -n 1)
          test -n "$ROOT"
          cd "$(dirname "$ROOT")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Dogos-Los-Encinos-APK
          path: proyecto/**/app/build/outputs/apk/debug/*.apk
