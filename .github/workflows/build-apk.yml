name: Build Dogos Los Encinos APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          mkdir -p proyecto
          unzip -o Dogosproyecto.zip -d proyecto
          find proyecto -type f -name gradlew

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Configurar Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Verificar archivos
        run: |
          find proyecto -maxdepth 5 -type f | head -100

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd proyecto
          gradle assembleDebug

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Dogos-Los-Encinos-APK
          path: proyecto/**/app/build/outputs/apk/debug/*.apk
